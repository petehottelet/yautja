[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yautja"
version = "2.10.0"
description = "Sci-fi segmentation, re-skinning, and annotation for thermal-style images and video."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pete Hottelet"}]
keywords = ["thermal", "image-segmentation", "video", "sci-fi", "agent-skill", "claude", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "fonttools>=4.55,<5"]

[project.optional-dependencies]
tracking = ["opencv-python-headless>=4.10,<5"]
semantic = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "transformers==4.57.6",
  "opencv-python-headless>=4.10,<5", "scipy>=1.11,<2",
]
all = ["yautja[tracking,semantic]"]
dev = [
  "build==1.3.0", "twine==6.2.0", "setuptools==80.9.0", "wheel==0.45.1",
  "packaging==25.0", "tomli==2.3.0; python_version < '3.11'",
]

[project.scripts]
yautja = "yautja.cli:main"

[project.urls]
Homepage = "https://yautja.ai"
Repository = "https://github.com/petehottelet/yautja"
Issues = "https://github.com/petehottelet/yautja/issues"
Changelog = "https://github.com/petehottelet/yautja/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yautja*"]
namespaces = false

[tool.setuptools.package-data]
yautja = ["assets/glyphs.json", "assets/cyber-glyphs.json", "assets/fonts/Michroma-Regular.ttf", "assets/fonts/Michroma-OFL.txt", "assets/fonts/README.md", "assets/fonts/Orbitron-Light.ttf", "assets/fonts/Orbitron-Medium.ttf", "assets/fonts/Orbitron-Bold.ttf", "assets/fonts/Orbitron-OFL.txt"]
