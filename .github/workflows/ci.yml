name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
        mode: [tracking]
        include:
          - os: ubuntu-latest
            python: '3.10'
            mode: classic
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install package and explicit build tools
        run: python -m pip install -e '.[dev]'
      - name: Install optional offline tracking dependency
        if: matrix.mode == 'tracking'
        run: python -m pip install -e '.[tracking]'
      - name: Validate runtime
        run: |
          yautja --doctor
          python -m yautja --version
      - name: Build, validate, and reproduce release artifacts
        run: python -m tools.prepare_release
      - name: Test conversion, tracking, and packaged runtime
        run: python -m unittest discover -s tests -v
      - name: Verify clean wheel, offline skill, and sdist installs
        run: python -m tools.verify_install
      - name: Save validated build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yautja-build
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/yautja-skill.zip
            dist/SHA256SUMS.txt
