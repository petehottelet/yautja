name: Release portable skill

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release version
        run: python -c "import os; from pathlib import Path; assert os.environ['RELEASE_TAG'] == 'v' + Path('VERSION').read_text().strip(), 'Release tag must match VERSION'"
      - name: Install test runtime
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt 'opencv-python-headless>=4.10,<5'
      - name: Test before packaging
        run: python -m unittest discover -s tests -v
      - name: Build archive and checksum
        run: |
          python scripts/package_skill.py --zip dist/yautja.zip
          python -c "import hashlib; from pathlib import Path; p = Path('dist/yautja.zip'); Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  yautja.zip\n')"
      - name: Attach portable skill to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/yautja.zip dist/SHA256SUMS.txt --clobber
